name: QueueLess CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Backend & Frontend Lint, Test, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: queueless
          POSTGRES_PASSWORD: queueless_secret
          POSTGRES_DB: queueless_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client & Run Unit Tests
        env:
          DATABASE_URL: postgresql://queueless:queueless_secret@localhost:5432/queueless_test
          TEST_DATABASE_URL: postgresql://queueless:queueless_secret@localhost:5432/queueless_test
          JWT_ACCESS_SECRET: 68f0f865ad4c4a5c9dbffc7035332b30b321d3df9e6164a57f87f2ee92264157
          JWT_REFRESH_SECRET: b927a7ea6ff315b4974f26ee009e5b565a88cfd3f9f95d8f6d654067efc4a179
        run: |
          cd backend
          npx prisma generate
          npm test

      - name: Build Backend TypeScript
        run: |
          cd backend
          npm run build

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

  docker-build:
    name: Docker Containerization Image Verification
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: queueless-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: queueless-frontend:latest
