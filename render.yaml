services:
  # Backend Web Service
  - type: web
    name: eventbook-api
    env: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false # Neon.tech PostgreSQL connection string
      - key: REDIS_URL
        sync: false # Upstash Redis connection string
      - key: CORS_ORIGIN
        sync: false # Deployed Frontend URL (e.g. Vercel or Render URL)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
    healthCheckPath: /health
