global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'queueless-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000', 'backend:3000']
        labels:
          app: 'queueless'
          service: 'backend-api'
          environment: 'production'
